name: Bug report
description: Report a problem with a Kanagawa port.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report bugs in the affected port's own issue tracker when one exists.
        Use this form for ports that do not provide their own. Do not include
        passwords, tokens, or other secrets.
  - type: input
    id: port
    attributes:
      label: Port
      description: The application and repository the bug affects.
      placeholder: e.g. Neovim (kanagawa-community/neovim)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Port and application versions
      placeholder: e.g. Kanagawa 1.2.0, Neovim 0.12.0
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Variant
      options:
        - Wave
        - Dragon
        - Lotus
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and what happened instead
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Linux, macOS 15
